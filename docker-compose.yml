services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: faredelta
      POSTGRES_USER: faredelta
      POSTGRES_PASSWORD: faredelta
    ports:
      - "5432:5432"
    volumes:
      - faredelta_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faredelta -d faredelta"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  faredelta_postgres:

